<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Reklama B – Koupíte si VOO v Česku?</title>
<!-- Jen pro vykreslení kreativy (PNG); stránka sama písma servíruje přes next/font. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Plus+Jakarta+Sans:wght@200..800&display=block&subset=latin-ext">
<style>
/*
 * Design (Tom, 16. 10. 2026): čistě bílé pozadí, vzdušné sekce, karty s tenkým rámečkem,
 * výrazná hierarchie nadpisů a barevně odlišená klíčová slova (fakta indigo, ztráta červená,
 * nejvýhodnější evropské dvojče zelená). Paleta Toma: #FFC349 (CTA), #57008E.
 *
 * Jediné místo pro barvy, typografii, mezery, rádiusy, stíny a délky přechodů.
 * Komponenty používají jen var(--…). Textové kombinace barev mají kontrast
 * aspoň 4,5 : 1 (WCAG AA), kontroluje je tokens.test.ts – při změně palety
 * spusťte `npm run test`.
 */

:root {
  /* Paleta (Tom) */
  --palette-yellow: #ffc349; /* jen plocha s tmavým textem – jako text na bílé má 1,6 : 1 */
  --palette-purple: #57008e; /* text i plocha (11,7 : 1 na bílé) */
  --palette-sky: #5facd3; /* jen dekorace – jako text na bílé má 2,5 : 1 */

  /* Podklad a inkoust */
  --color-bg: #ffffff; /* čistě bílé pozadí celé stránky */
  --color-surface: #ffffff; /* karty, formulář */
  --color-surface-muted: #f6f7f9; /* americké karty, jemně odlišené plochy */
  --color-ink: #161a33; /* hlavní text (tmavě modrošedý) */
  --color-ink-muted: #4a5072; /* vedlejší text, popisky */
  --color-border: #7c82a0; /* okraje polí (≥ 3 : 1 vůči podkladu) */
  --color-border-subtle: #e3e7ef; /* dekorativní oddělovače, stopa jezdce */
  --color-card-border: #dfe3ea; /* 1px rámeček karet (dekorativní, karty nejsou ovládací prvek) */

  /* Barevně odlišená klíčová slova */
  --color-fact: #3730a3; /* neutrální fakta: tickery, index, vložené a hrubé částky (9,9 : 1) */
  --color-loss: #b42318; /* ztráta na poplatcích (6,6 : 1) */
  --color-gain: #166534; /* nejvýhodnější evropské dvojče (7,1 : 1) */

  /* Hero nadpis: každé slovo jinou barvou (NENÍ / ETF / JAKO / ETF). Bez zelené (= správná
     odpověď) a bez červené (= ztráta). */
  --color-hero-word-1: #0e7490; /* petrolejová – odlišná od navy karty s otázkou */
  --color-hero-word-2: var(--palette-purple);
  --color-hero-word-3: #1d4ed8; /* královská modrá */
  --color-hero-word-4: #b45309; /* jantarová, ladí se žlutým CTA */

  /* Vlajky v hero (dekorativní SVG „dvojčata vlajek“, ne text) */
  --color-flag-us-red: #b22234;
  --color-flag-us-blue: #3c3b6e;
  --color-flag-eu-blue: #003399;
  --color-flag-eu-yellow: #ffcc00;
  --color-flag-white: #ffffff;
  --size-hero-visual: clamp(5.5rem, 27vw, 15rem);
  --shadow-flag: drop-shadow(0 0.375rem 0.75rem rgb(22 26 51 / 0.18));
  --duration-flag-float: 6s;
  --distance-flag-float: -0.25rem;

  /* Proužek poplatku na kartě a šipka mezi páry */
  --size-fee-bar: 0.375rem;
  --color-fee-bar-track: var(--color-card-border);
  --duration-fee-bar: 600ms;
  --size-pair-arrow: 1.75rem;

  /* Světlé pozadí dvojic fondů (US ↔ UCITS), každá dvojice jiné; bez zelené a červené */
  --color-pair-1: #eef2ff; /* světle modrá */
  --color-pair-2: #fff4e5; /* meruňková */
  --color-pair-3: #f5edfc; /* levandulová */
  /* Tickery na kartách: tmavá verze pozadí dvojice (Tom 16. 10.) */
  --color-pair-1-ink: #3730a3; /* tmavě indigová */
  --color-pair-2-ink: #92400e; /* tmavě jantarová */
  --color-pair-3-ink: #6b21a8; /* tmavě fialová */

  /* Tmavé karty (otázka kvízu, nabídka PDF): bílý text, žlutý fokus a fajfky */
  --color-quiz-bg: #0b1f4d; /* navy */
  --color-quiz-glow: #16306e; /* světlejší navy pro odlesk */
  --color-quiz-grid: rgb(255 255 255 / 0.06); /* jemná architektonická mřížka */
  --size-quiz-grid: 1.5rem;
  --color-lead-bg: var(--palette-purple);
  --color-lead-glow: #6b1aa6; /* světlejší fialová pro odlesk */
  --color-on-dark: #ffffff;
  --color-on-dark-muted-quiz: #c7d2fe;
  --color-on-dark-muted-lead: #e9d5ff;
  --color-on-dark-accent: var(--palette-yellow); /* fajfky, fokus na tmavém */
  --color-on-dark-error: #ffd5cf; /* chyba na fialové (červená by zanikla) */

  /* Akcent: CTA (žlutá plocha s tmavým textem a obrysem) */
  --color-accent: var(--color-fact);
  --color-accent-fill: var(--palette-yellow);
  --color-on-accent-fill: #161a33;
  --color-accent-fill-hover: #f5b12e;
  --color-accent-fill-border: var(--color-ink);

  /* Zvolená odpověď kvízu: zelená = správně (NE), červená = špatně (ANO) */
  --color-answer-correct: #15803d;
  --color-answer-wrong: var(--color-error);
  --color-on-answer: #ffffff;

  /* Odznaky: „nejnižší TER“ (zelená) a „V ČR obvykle nekoupíte“ (červená) – vždy s textem */
  --color-badge-bg: #dcfce7;
  --color-badge-ink: #14532d;
  --color-badge-warn-bg: #fdecea;
  --color-badge-warn-ink: #9f1d14;

  /* Americké karty – jemně zašedlé, ale čitelné */
  --color-us-card-bg: var(--color-surface-muted);
  --color-us-card-ink: #3a3f5c;
  --color-us-card-ink-muted: #4a5072;

  /* Stavy */
  --color-error: #b42318;
  --color-focus: var(--palette-purple);

  /* Typografie – Plus Jakarta Sans (text) a Outfit (nadpisy) přes next/font (shared/lib/fonts.ts) */
  --font-sans: var(--font-plus-jakarta-sans), system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-numeric: var(--font-sans);
  --font-heading: var(--font-outfit), var(--font-sans);
  --font-weight-heading: 700;

  --font-size-sm: 1rem; /* 16 px – drobné poznámky, minimum */
  --font-size-md: 1.125rem; /* 18 px – základní text */
  --font-size-lg: 1.375rem; /* 22 px */
  --font-size-xl: 1.75rem; /* 28 px */
  --font-size-2xl: 2.25rem; /* 36 px */
  --font-size-3xl: 3rem; /* 48 px */
  --font-size-body: var(--font-size-md);

  /* Hero: velká slova (NENÍ, ETF) a malá (ETF, JAKO) v poměru 2 : 1 */
  --font-size-hero-big: clamp(3.5rem, 17vw, 7.5rem);
  --font-size-hero-small: calc(var(--font-size-hero-big) / 2);

  /* Variabilní písma: Plus Jakarta Sans 200–800, Outfit 100–900 */
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-bold: 600;
  --font-weight-black: 800;

  --line-height-hero: 0.95;
  --line-height-tight: 1.15;
  --line-height-snug: 1.3;
  --line-height-body: 1.6;

  --letter-spacing-caps: 0.02em;
  --letter-spacing-tight: -0.02em;
  --letter-spacing-label: 0.08em;

  /* Mezery */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 3rem;
  --space-8: 4rem;
  --space-9: 6rem;

  --page-gutter: var(--space-5);
  --content-max-width: 48rem;
  --section-gap: var(--space-8);

  /* Dotykové plochy */
  --touch-target: 3.25rem; /* 52 px */

  /* Jezdce (input type="range") */
  --slider-track-height: 0.375rem;
  --slider-thumb-size: 1.75rem; /* vizuálně 28 px, dotyková plocha = výška inputu (--touch-target) */
  --color-slider-track: var(--color-border-subtle);
  --color-slider-fill: var(--color-fact);

  /* Rádiusy – ostřejší, architektonické */
  --radius-sm: 0.25rem;
  --radius-md: 0.5rem;
  --radius-lg: 0.75rem;
  --radius-pill: 999rem;

  /* Okraje */
  --border-width: 0.0625rem; /* 1 px */
  --border-width-strong: 0.125rem; /* 2 px */
  --focus-ring-width: 0.1875rem; /* 3 px */
  --focus-ring-offset: 0.125rem; /* 2 px */

  /* Stíny – jen jemné, hlavně při najetí */
  --shadow-card: 0 0.0625rem 0.125rem rgb(22 26 51 / 0.04);
  --shadow-card-hover: 0 0.5rem 1.5rem rgb(22 26 51 / 0.1);
  --shadow-sticky: 0 -0.25rem 1rem rgb(22 26 51 / 0.12);
  --lift-card-hover: -0.125rem; /* posun karty nahoru při najetí */

  /* Délky přechodů */
  --duration-fast: 120ms;
  --duration-base: 200ms;
  --easing-standard: cubic-bezier(0.2, 0, 0, 1);
}

:root {
  --font-plus-jakarta-sans: "Plus Jakarta Sans";
  --font-outfit: "Outfit";
  --ad-pad: 88px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; }
body {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 32px;
  padding: 72px var(--ad-pad) 64px;
  overflow: hidden;
  background: var(--color-bg);
  color: var(--color-ink);
  font-family: var(--font-sans);
}
.brand {
  color: var(--color-ink-muted);
  font-size: 26px;
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--letter-spacing-label);
  text-transform: uppercase;
}
.flags { display: block; overflow: visible; }
.flag { filter: var(--shadow-flag); }
.white { fill: var(--color-flag-white); }
.us-red { fill: var(--color-flag-us-red); }
.us-blue { fill: var(--color-flag-us-blue); }
.eu-blue { fill: var(--color-flag-eu-blue); }
.eu-yellow { fill: var(--color-flag-eu-yellow); }
.frame { fill: none; stroke: var(--color-flag-white); stroke-width: 1.5; }
h1 {
  display: grid;
  font-family: var(--font-heading);
  line-height: var(--line-height-hero);
  letter-spacing: var(--letter-spacing-tight);
}
.line { display: flex; align-items: baseline; gap: 28px; }
.w1 { color: var(--color-hero-word-1); }
.w2 { color: var(--color-hero-word-2); }
.w3 { color: var(--color-hero-word-3); }
.w4 { color: var(--color-hero-word-4); }
.cta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 32px;
  border: 4px solid var(--color-accent-fill-border);
  border-radius: var(--radius-md);
  background: var(--color-accent-fill);
  color: var(--color-on-accent-fill);
  font-size: 34px;
  font-weight: var(--font-weight-black);
  letter-spacing: var(--letter-spacing-caps);
  text-transform: uppercase;
}
.cta svg { width: 44px; height: 44px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.source { color: var(--color-ink-muted); font-size: 22px; margin-top: -12px; }

h1 { margin-top: 8px; }
.lead { font-size: 104px; font-weight: var(--font-weight-bold); }
.ticker { font-size: 300px; font-weight: var(--font-weight-black); color: var(--color-pair-1-ink); line-height: 0.9; }
/* Tlačítka ANO / NE ve stylu kvízu na stránce (žlutá plocha, tmavý obrys), vlajky drobně vedle */
.answers { display: grid; grid-template-columns: 1fr 1fr 220px; align-items: center; gap: 24px; margin-top: 24px; }
.answer {
  display: grid;
  place-items: center;
  height: 168px;
  border: 4px solid var(--color-accent-fill-border);
  border-radius: var(--radius-md);
  background: var(--color-accent-fill);
  color: var(--color-on-accent-fill);
  font-size: 72px;
  font-weight: var(--font-weight-black);
  letter-spacing: var(--letter-spacing-caps);
}
.answers .flags { width: 220px; }
.hook {
  font-family: var(--font-heading);
  font-size: 56px;
  font-weight: var(--font-weight-heading);
  line-height: var(--line-height-tight);
  letter-spacing: var(--letter-spacing-tight);
}
.bottom { display: grid; gap: 28px; margin-top: auto; }
/* CTA tmavé, aby se nepletlo se žlutými tlačítky odpovědí */
.bottom .cta {
  border-color: var(--color-ink);
  background: var(--color-ink);
  color: var(--color-on-dark);
}
</style>
</head>
